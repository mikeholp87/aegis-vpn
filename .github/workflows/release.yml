name: Development preview packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev rpm
      - name: Build the root helper packaged with the app
        run: cargo build --release --locked -p aegis-helper
      - name: Build preview installers
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --ci --bundles deb,rpm -- --locked
      - name: Verify artifacts and write checksums
        working-directory: target/release/bundle
        run: |
          shopt -s nullglob
          deb=(deb/*.deb)
          rpm=(rpm/*.rpm)
          test "${#deb[@]}" -eq 1
          test "${#rpm[@]}" -eq 1
          sha256sum "${deb[@]}" "${rpm[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Record locked dependency inventory
        run: cargo metadata --locked --format-version 1 > cargo-dependencies.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-vpn-linux-development-preview
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/SHA256SUMS.txt
            cargo-dependencies.json
