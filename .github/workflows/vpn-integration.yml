name: Isolated Linux VPN integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  networkmanager-vm:
    name: WireGuard switching, routing, DNS and IPv6 (QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install isolated test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 genisoimage musl-tools openssh-client curl
          sudo chmod 666 /dev/kvm
      - name: Run tests entirely inside disposable VM
        run: scripts/vm/run-vm-tests.sh
