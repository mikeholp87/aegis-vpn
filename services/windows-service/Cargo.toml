[package]
name = "aegis-service"
description = "Privileged Windows service for Aegis VPN: named-pipe server for the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# This runs as LocalSystem. Keep the dependency list short and audited.
# The crate is Windows-only; other hosts build an empty stub so the workspace
# still compiles everywhere.

[lib]
name = "aegis_service"

[[bin]]
name = "aegis-service"

[dependencies]
aegis-core.workspace = true
aegis-config.workspace = true
aegis-windows.workspace = true
uuid.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal"] }
thiserror.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util", "net", "time"] }

[lints]
workspace = true
